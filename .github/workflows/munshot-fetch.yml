name: munshot-fetch

on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Capture MUNS agent response
        env:
          MUNS_TOKEN: ${{ secrets.MUNS_TOKEN }}
        run: |
          mkdir -p munshot-outputs
          TO_DATE="$(date -u +%Y-%m-%d)"
          curl -i -sS -X POST https://devde.muns.io/agents/run \
            -H "Authorization: Bearer ${MUNS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data @- > munshot-outputs/agent-e570e8dc-f9df-4d7b-bbd0-de58c5c7a49b.txt <<EOF
          {
            "agent_library_id": "e570e8dc-f9df-4d7b-bbd0-de58c5c7a49b",
            "metadata": {
              "stock_ticker": "JIOFIN",
              "stock_company_name": "Jio Financial Services Ltd.",
              "context_company_name": "Jio Financial Services Ltd.",
              "stock_country": "INDIA",
              "to_date": "${TO_DATE}",
              "timezone": "UTC"
            }
          }
          EOF

      - name: Commit sample
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add munshot-outputs/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            BRANCH="$(git rev-parse --abbrev-ref HEAD)"
            git commit -m "munshot: capture sample"
            for attempt in 1 2 3; do
              git fetch origin "$BRANCH"
              git rebase "origin/$BRANCH" || git rebase --abort
              if git push origin "HEAD:$BRANCH"; then
                exit 0
              fi
              echo "Push attempt $attempt failed; retrying..."
              sleep 2
            done
            echo "All push attempts failed." >&2
            exit 1
          fi
